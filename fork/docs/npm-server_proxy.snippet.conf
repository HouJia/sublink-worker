# Sub-Store: 勿在同域 /main.js、/subs/；见 Mac 技能 references/substore.md

# Sublink Worker（BASE_PATH=/sublink）
# proxy_pass 使用 Docker 容器名 sublink-worker（非公网域名）；须先将 NPM 加入 sublink-net：
#   docker network connect sublink-net nginx-proxy-manager
location = /sublink {
    return 301 $scheme://$http_host/sublink/;
}
location ^~ /sublink/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sublink;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600;
    proxy_pass http://sublink-worker:8787;
}
