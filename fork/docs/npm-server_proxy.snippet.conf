# Sub-Store: 勿在同域 /main.js、/subs/；见 Mac 技能 references/substore.md

# Sublink Worker（BASE_PATH=/sublink）
location = /sublink {
    return 301 $scheme://$http_host/sublink/;
}
location ^~ /sublink/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sublink;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600;
    proxy_pass http://192.168.0.6:58087;
}
