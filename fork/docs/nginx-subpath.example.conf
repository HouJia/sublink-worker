# Sublink fork 子路径反代示例（默认 BASE_PATH=/sublink）
# 放入 NPM Proxy Host 的 Advanced → Custom locations，或 server_proxy.conf

location = /sublink {
    return 301 $scheme://$http_host/sublink/;
}

location ^~ /sublink/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sublink;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600;
    proxy_pass http://192.168.0.6:8787;
}
